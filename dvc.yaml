stages:
  data_ingestion:
    cmd: python src/components/data_ingestion.py
    deps:
    - src/components/data_ingestion.py
    outs:
    - data/raw_data

  data_preprocessing:
    cmd: python src/components/data_transformation.py
    deps:
    - data/raw_data
    - src/components/data_transformation.py
    outs:
    - data/interim_data

  feature_engineering:
    cmd: python src/components/feature_engineering.py
    deps:
    - data/interim_data
    - src/components/feature_engineering.py
    outs:
    - data/processed_data

  model_building:
    cmd: python src/components/model_trainer.py
    deps:
    - data/processed_data
    - src/components/model_trainer.py
    outs:
    - models/model.pkl

  model_evaluation:
    cmd: python src/components/model_evaluation.py
    deps:
    - data/processed_data
    - models/model.pkl
    - src/components/model_evaluation.py
    metrics:
    - reports/metrics.json